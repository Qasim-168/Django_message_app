<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real-Time Chat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; height: 100vh; display: flex; justify-content: center; align-items: center; }
  .container { width: 460px; background: #fff; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.12); overflow: hidden; }

  /* ---------- Auth panel ---------- */
  #auth-panel { padding: 30px; }
  #auth-panel h2 { margin-bottom: 18px; }
  #auth-panel input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; }
  #auth-panel button { width: 100%; padding: 10px; border: none; border-radius: 6px; background: #0d6efd; color: #fff; cursor: pointer; font-size: 15px; margin-bottom: 6px; }
  #auth-panel button:hover { background: #0b5ed7; }
  #auth-panel .toggle { text-align: center; margin-top: 6px; cursor: pointer; color: #0d6efd; font-size: 13px; }
  #auth-error { color: #dc3545; font-size: 13px; margin-bottom: 8px; display: none; }

  /* ---------- Chat panel ---------- */
  #chat-panel { display: none; flex-direction: column; height: 600px; }
  .chat-header { padding: 14px 18px; background: #0d6efd; color: #fff; display: flex; justify-content: space-between; align-items: center; }
  .chat-header .user-select { display: flex; align-items: center; gap: 10px; }
  .chat-header select { padding: 4px 8px; border-radius: 4px; border: none; }
  .chat-header .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .chat-header .status-dot.online { background: #28a745; }
  .chat-header .status-dot.offline { background: #adb5bd; }
  .chat-header button { background: none; border: 1px solid rgba(255,255,255,.5); color: #fff; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }

  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; background: #f0f2f5; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
  .msg.sent { align-self: flex-end; background: #0d6efd; color: #fff; border-bottom-right-radius: 4px; }
  .msg.received { align-self: flex-start; background: #fff; color: #212529; border-bottom-left-radius: 4px; }
  .msg .meta { font-size: 11px; opacity: .7; margin-top: 4px; }
  .msg.sent .meta { text-align: right; }

  #typing-indicator { padding: 4px 18px; font-size: 12px; color: #6c757d; min-height: 22px; }

  .chat-input { display: flex; padding: 10px 14px; gap: 8px; border-top: 1px solid #dee2e6; background: #fff; }
  .chat-input input { flex: 1; padding: 10px; border: 1px solid #ced4da; border-radius: 20px; outline: none; }
  .chat-input button { padding: 10px 20px; background: #0d6efd; color: #fff; border: none; border-radius: 20px; cursor: pointer; }
</style>
</head>
<body>

<div class="container">
  <!-- ==================== AUTH ==================== -->
  <div id="auth-panel">
    <h2 id="auth-title">Login</h2>
    <div id="auth-error"></div>
    <input id="auth-username" placeholder="Username" />
    <input id="auth-email" placeholder="Email (register only)" style="display:none" />
    <input id="auth-password" type="password" placeholder="Password" />
    <button id="auth-submit" onclick="submitAuth()">Login</button>
    <div class="toggle" id="auth-toggle" onclick="toggleAuthMode()">Don't have an account? Register</div>
  </div>

  <!-- ==================== CHAT ==================== -->
  <div id="chat-panel">
    <div class="chat-header">
      <div class="user-select">
        <select id="user-select" onchange="switchChat()"></select>
        <span id="partner-status" class="status-dot offline"></span>
      </div>
      <button onclick="logout()">Logout</button>
    </div>
    <div id="messages"></div>
    <div id="typing-indicator"></div>
    <div class="chat-input">
      <input id="msg-input" placeholder="Type a message…" onkeydown="handleKeyDown(event)" oninput="sendTyping()" />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:8000';
let accessToken = null;
let currentUser = null;      // { id, username }
let partnerId = null;
let socket = null;
let isRegister = false;
let typingTimeout = null;

// ===================== AUTH =====================

function toggleAuthMode() {
  isRegister = !isRegister;
  document.getElementById('auth-title').textContent = isRegister ? 'Register' : 'Login';
  document.getElementById('auth-submit').textContent = isRegister ? 'Register' : 'Login';
  document.getElementById('auth-email').style.display = isRegister ? 'block' : 'none';
  document.getElementById('auth-toggle').textContent = isRegister
    ? 'Already have an account? Login'
    : "Don't have an account? Register";
  hideError();
}

function showError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError() { document.getElementById('auth-error').style.display = 'none'; }

async function submitAuth() {
  hideError();
  const username = document.getElementById('auth-username').value.trim();
  const password = document.getElementById('auth-password').value;
  if (!username || !password) { showError('Username and password are required'); return; }

  if (isRegister) {
    const email = document.getElementById('auth-email').value.trim();
    const res = await fetch(`${API}/api/auth/register/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password }),
    });
    if (!res.ok) { const d = await res.json(); showError(JSON.stringify(d)); return; }
  }

  // Login (obtain JWT)
  const res = await fetch(`${API}/api/auth/login/`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password }),
  });
  if (!res.ok) { showError('Invalid credentials'); return; }
  const data = await res.json();
  accessToken = data.access;

  // Fetch user list to identify ourselves and populate partner selector
  const usersRes = await fetch(`${API}/api/auth/users/`, {
    headers: { Authorization: `Bearer ${accessToken}` },
  });
  const users = await usersRes.json();
  currentUser = users.find(u => u.username === username);

  const select = document.getElementById('user-select');
  select.innerHTML = '<option value="">-- Select user --</option>';
  users.filter(u => u.id !== currentUser.id).forEach(u => {
    const opt = document.createElement('option');
    opt.value = u.id;
    opt.textContent = u.username;
    select.appendChild(opt);
  });

  document.getElementById('auth-panel').style.display = 'none';
  document.getElementById('chat-panel').style.display = 'flex';
}

function logout() {
  if (socket) socket.close();
  accessToken = null;
  currentUser = null;
  partnerId = null;
  document.getElementById('auth-panel').style.display = 'block';
  document.getElementById('chat-panel').style.display = 'none';
  document.getElementById('messages').innerHTML = '';
}

// ===================== CHAT =====================

async function switchChat() {
  const id = document.getElementById('user-select').value;
  if (!id) return;
  partnerId = parseInt(id);
  document.getElementById('messages').innerHTML = '';

  // Close previous socket
  if (socket) socket.close();

  // Load history
  const res = await fetch(`${API}/api/chat/history/${partnerId}/`, {
    headers: { Authorization: `Bearer ${accessToken}` },
  });
  const msgs = await res.json();
  msgs.forEach(m => appendMessage(m));

  // Open WebSocket
  const wsScheme = 'ws';
  socket = new WebSocket(`${wsScheme}://localhost:8000/ws/chat/${partnerId}/?token=${accessToken}`);
  socket.onmessage = (e) => handleWsMessage(JSON.parse(e.data));
  socket.onclose = () => { document.getElementById('partner-status').className = 'status-dot offline'; };
}

function appendMessage(m) {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  const isMine = m.sender === currentUser.id || m.sender_id === currentUser.id;
  div.className = `msg ${isMine ? 'sent' : 'received'}`;
  div.id = `msg-${m.id || m.message_id}`;

  let statusText = '';
  if (isMine) {
    if (m.is_read) statusText = ' · Read';
    else if (m.is_delivered) statusText = ' · Delivered';
    else statusText = ' · Sent';
  }

  const ts = new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  div.innerHTML = `${escapeHtml(m.content || m.message)}<div class="meta">${ts}${statusText}</div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function handleWsMessage(data) {
  if (data.type === 'chat_message') {
    appendMessage(data);
    // Auto-send read receipt for received messages
    if (data.sender_id !== currentUser.id && socket && socket.readyState === 1) {
      socket.send(JSON.stringify({ type: 'read_receipt', message_ids: [data.message_id] }));
    }
  } else if (data.type === 'typing') {
    const el = document.getElementById('typing-indicator');
    el.textContent = data.is_typing ? `${data.username} is typing…` : '';
  } else if (data.type === 'user_status') {
    const dot = document.getElementById('partner-status');
    dot.className = `status-dot ${data.status}`;
  } else if (data.type === 'read_receipt') {
    data.message_ids.forEach(id => {
      const el = document.getElementById(`msg-${id}`);
      if (el) {
        const meta = el.querySelector('.meta');
        if (meta) meta.textContent = meta.textContent.replace(/· (Sent|Delivered)/, '· Read');
      }
    });
  }
}

function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !socket || socket.readyState !== 1) return;
  socket.send(JSON.stringify({ type: 'chat_message', message: text }));
  input.value = '';
  // Stop typing indicator
  if (typingTimeout) clearTimeout(typingTimeout);
  socket.send(JSON.stringify({ type: 'typing', is_typing: false }));
}

function handleKeyDown(e) {
  if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
}

function sendTyping() {
  if (!socket || socket.readyState !== 1) return;
  socket.send(JSON.stringify({ type: 'typing', is_typing: true }));
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => {
    if (socket && socket.readyState === 1) {
      socket.send(JSON.stringify({ type: 'typing', is_typing: false }));
    }
  }, 2000);
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}
</script>
</body>
</html>
